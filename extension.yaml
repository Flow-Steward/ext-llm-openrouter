manifest_version: 2
lifecycle: {data_schema_version: 1, data_migrations: []}
extension_id: flowsteward.openrouter
kind: tool_provider
version: 1.2.3
release_stage: active
display_name: OpenRouter LLM Provider
description: |-
  Choose models from multiple publishers for your Flow Steward agents using OpenRouter LLM Provider. Discover the provider's catalog, search for models and add those that pass Flow Steward's capability verification. Selected models appear in the model catalog grouped by their upstream publisher, and can be assigned to agents or used as a project's default model.

  The integration supports conversations, function calls with tool-result replay, and JSON Schema-guided structured responses through OpenRouter's chat-completion API. It preserves supported reasoning continuation data across tool turns and passes through token usage and a reported cost when supplied by OpenRouter. Requests involving tools or structured output ask OpenRouter to route to endpoints supporting those parameters.

  Use it to choose between multiple model publishers while managing provider access through one OpenRouter account. Discovery lists catalog metadata rather than guaranteeing that every model is usable: enabled models must support chat, tool calling and structured output and pass the host's verification. Your credits, limits, model access and upstream endpoint availability still apply. The extension uses the fixed OpenRouter service and requires no separate inference server deployment.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-llm-openrouter/issues
  website_url: https://github.com/Flow-Steward/ext-llm-openrouter
listing:
  category: ai
  tags:
  - llm
  - openrouter
  summary: Connect OpenRouter models to Flow Steward agents with one API key, model discovery, tool use and structured
    responses.
  setup_summary: Enter a complete OpenRouter API key in the account-scoped LLM provider panel, then discover models
    and select the ones to verify and enable. Ensure the account has the credits and permissions needed for those
    models.
features:
  - tool
  - llm_provider
required_scopes:
  - extension:invoke
machine_auth:
  service_account_key: svc_ext_openrouter
  required_scopes:
    - extension:invoke
account_scope:
  scope_type: account
  description: OpenRouter provider credentials are account-scoped.
entrypoint:
  mode: subprocess
  command:
    - python3
    - main.py
  timeout_seconds: 120
health:
  command:
    - python3
    - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
python_requirements: []
runtime:
  contract_version: extension_host_v2
  compatibility:
    platform_min: 1.3.0
  extension_contract_v2:
    llm_provider:
      schema_version: llm_provider_extension_v1
      supplier_key: openrouter
      supplier_label: OpenRouter
      runtime_mode: subprocess
      credential_provider_key: openrouter
      required_provider_secrets:
        - api_key
      optional_provider_secrets: []
      # Shown under the field in Flow Steward's provider settings (contract 1.3.0).
      provider_secret_help:
        api_key: "Create a key at openrouter.ai/settings/keys and copy it whole with the copy button. It starts with sk-or-v1-. Models outside your credits or limits are refused at verification."
      operations:
        list_models:
          query_id: llm.list_models
        chat:
          action_id: llm.chat
        structured_chat:
          action_id: llm.chat_structured
          optional: true
      model_grouping:
        strategy: upstream_owner
        owner_key_field: upstream_owner_key
        owner_label_field: upstream_owner_label
      required_capabilities_for_enablement:
        - chat
        - tools
        - structured_output
